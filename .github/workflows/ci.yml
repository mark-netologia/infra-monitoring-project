name: Bash CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_log.sh

      - name: Test API monitoring
        run: bash check_api.sh https://httpbin.org/status/200
